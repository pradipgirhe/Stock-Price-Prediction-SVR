<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Stock Price Predictor 📈</h1>
        <p>Enter stock data to predict the next day's closing price</p>

        <form action="/predict" method="POST">
            <label for="open">Open Price</label>
            <input type="number" step="0.01" name="open" id="open" placeholder="e.g., 150.25" required>

            <label for="high">High Price</label>
            <input type="number" step="0.01" name="high" id="high" placeholder="e.g., 155.30" required>

            <label for="low">Low Price</label>
            <input type="number" step="0.01" name="low" id="low" placeholder="e.g., 148.90" required>

            <label for="volume">Volume</label>
            <input type="number" name="volume" id="volume" placeholder="e.g., 12000000" required>

            <button type="submit">Predict Closing Price</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            <h2>{{ prediction_text }}</h2>
        </div>
        {% endif %}

        {% if historical_data %}
        <h3>Last 30 Days Closing Prices</h3>
        <canvas id="stockChart"></canvas>
        <script>
            const ctx = document.getElementById('stockChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: {{ historical_data.dates|safe }},
                    datasets: [{
                        label: 'Closing Price',
                        data: {{ historical_data.prices|safe }},
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255, 215, 0, 0.2)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: true, position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: false }
                    }
                }
            });
        </script>
        {% endif %}
    </div>
</body>
</html>
